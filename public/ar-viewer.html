<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Viewer</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: black; font-family: -apple-system, sans-serif; }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999;
      background: rgba(0,0,0,0.8);
      padding: 12px 16px;
      color: white;
    }
    .back {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 999;
      background: white;
      color: black;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      text-align: center;
      z-index: 998;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid white;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 14px; }
    .marker-list {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 999;
      background: rgba(0,0,0,0.85);
      padding: 16px;
      color: white;
      max-height: 200px;
      overflow-y: auto;
    }
    .marker-item {
      padding: 8px;
      margin: 4px 0;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
    }
    .note {
      position: fixed;
      top: 60px;
      left: 10px;
      right: 10px;
      z-index: 999;
      background: rgba(255,200,0,0.9);
      color: black;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="overlay" id="status">
    <strong>AR Viewer</strong>
    <div class="status" id="status-text">Loading...</div>
  </div>
  
  <a href="/" class="back">← Back</a>
  
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>Initializing camera...</div>
  </div>

  <div id="scene"></div>

  <script>
    const SUPABASE_URL = 'https://zywgdjbuttwyingoldgb.supabase.co'
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5d2dkamJ1dHR3eWluZ29sZGdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMjk2NzIsImV4cCI6MjA5MzgwNTY3Mn0.OQhE8u8JdmDLi-eBcguq7B81rFfOXPJ43vRpG_7aMdw'

    async function init() {
      try {
        // Fetch markers
        const res = await fetch(`${SUPABASE_URL}/rest/v1/image_markers`, {
          headers: { 'apikey': SUPABASE_KEY }
        })
        const markers = await res.json()
        
        if (markers.length === 0) {
          document.getElementById('loading').innerHTML = `
            <div style="font-size: 18px;">No markers yet</div>
            <div style="font-size: 14px; margin-top: 10px; opacity: 0.7;">Add markers in the dashboard first</div>
            <a href="/" style="display: inline-block; margin-top: 20px; padding: 12px 24px; background: white; color: black; border-radius: 8px; text-decoration: none;">Go to Dashboard</a>
          `
          return
        }

        document.getElementById('status-text').textContent = `${markers.length} markers loaded`
        document.getElementById('loading').style.display = 'none'

        // For now, use Hiro marker as demonstration
        // Full image tracking requires MindAR compilation
        const sceneHTML = `
          <a-scene 
            embedded 
            vr-mode-ui="enabled: false"
            arjs="sourceType: webcam; debugUIEnabled: false;"
          >
            <a-marker preset="hiro">
              <a-box position="0 0.5 0" color="red" depth="0.5" height="0.5" width="0.5"></a-box>
            </a-marker>
            <a-marker preset="kanji">
              <a-box position="0 0.5 0" color="blue" depth="0.5" height="0.5" width="0.5"></a-box>
            </a-marker>
            <a-entity camera></a-entity>
          </a-scene>
        `
        
        document.getElementById('scene').innerHTML = sceneHTML

        // Show note about image tracking
        const note = document.createElement('div')
        note.className = 'note'
        note.innerHTML = `
          <strong>📷 Test Mode</strong><br>
          This demo shows Hiro/Kanji markers. Your ${markers.length} image(s) are saved and ready for full image tracking integration.
        `
        document.body.appendChild(note)

        // Show marker list
        const list = document.createElement('div')
        list.className = 'marker-list'
        list.innerHTML = `
          <div style="font-weight: bold; margin-bottom: 8px;">Your Configured Images:</div>
          ${markers.map(m => `
            <div class="marker-item">
              <div style="font-weight: 500;">${m.name}</div>
              <div style="font-size: 12px; opacity: 0.7;">Scale: ${m.scale} | GLB: ${m.glb_url.substring(0, 40)}...</div>
            </div>
          `).join('')}
        `
        document.body.appendChild(list)
        
      } catch (e) {
        document.getElementById('loading').innerHTML = `
          <div style="color: #ff6b6b;">Error: ${e.message}</div>
          <a href="/" style="display: inline-block; margin-top: 20px; padding: 12px 24px; background: white; color: black; border-radius: 8px; text-decoration: none;">Back to Dashboard</a>
        `
      }
    }
    
    init()
  </script>
</body>
</html>
